[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "bugbix"
version = "1.0.0"
description = "Check whether a regression test catches the bug before your fix."
requires-python = ">=3.11"
readme = "README.md"
authors = [{name = "agammann"}]
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://github.com/agammann/bugbix"
Repository = "https://github.com/agammann/bugbix"
Issues = "https://github.com/agammann/bugbix/issues"

[project.scripts]
bugbix = "bugbix.cli:main"

[tool.setuptools.packages.find]
include = ["bugbix*"]
